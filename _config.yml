# GitHub Pages (Jekyll): estos archivos son de desarrollo y no se publican.
# El panel /admin/ sí se publica (es estático); sus datos están en Supabase.
exclude:
  - supabase/
  - tests/
  - docs/
  - package.json
  - package-lock.json
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - Gemfile
  - Gemfile.lock
